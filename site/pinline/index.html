<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keep your place while reading | MarioDigital</title>
  <meta name="description" content="PinLine for Windows by MarioDigital: a line on your screen that keeps your place while reading.">
  <link rel="canonical" href="https://mariodigital.eu/pinline/">
  <link rel="alternate" hreflang="nl" href="https://mariodigital.eu/pinline/nl/">
  <link rel="alternate" hreflang="en" href="https://mariodigital.eu/pinline/en/">
  <link rel="alternate" hreflang="de" href="https://mariodigital.eu/pinline/de/">
  <link rel="alternate" hreflang="fr" href="https://mariodigital.eu/pinline/fr/">
  <link rel="alternate" hreflang="es" href="https://mariodigital.eu/pinline/es/">
  <link rel="alternate" hreflang="it" href="https://mariodigital.eu/pinline/it/">
  <link rel="alternate" hreflang="x-default" href="https://mariodigital.eu/pinline/">
  <link rel="icon" href="pinline-icon.png" type="image/png">
  <style>
:root{--navy:#0B1B3A;--blue:#1696C8;--ink:#1F2937;--muted:#5A6475;--line:#E5E9F0;--soft:#F3F6FA;--red:#FF3B30}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
a{color:var(--blue)}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
header.top img{height:20px;display:block}
.langs{display:flex;flex-wrap:wrap;gap:6px;font-size:14px}
.langs a{padding:3px 9px;border-radius:999px;text-decoration:none;color:var(--muted);border:1px solid var(--line)}
.langs a[aria-current]{background:var(--navy);color:#fff;border-color:var(--navy)}
.hero{display:flex;gap:18px;align-items:center;padding:34px 0 10px}
.hero img{width:72px;height:72px;border-radius:16px;flex:none}
.hero h1{margin:0;font-size:34px;line-height:1.15;color:var(--navy)}
.hero p{margin:4px 0 0;color:var(--muted);font-size:17px}
.intro{font-size:17px;margin:14px 0 8px}
.demo{position:relative;margin:22px 0 8px;padding:18px 20px;background:var(--soft);border-radius:12px;color:#9AA3B2}
.demo .cur{color:var(--ink);font-weight:600}
.demo .pin{display:flex;align-items:center;margin:2px 0 4px}
.demo .pin i{width:18px;height:18px;border-radius:50%;background:var(--red);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none}
.demo .pin b{height:3px;background:var(--red);opacity:.9;flex:1;margin-left:-2px;border-radius:2px}
nav.toc{margin:22px 0 4px;font-size:15px}
nav.toc a{margin-right:14px;white-space:nowrap}
section{padding:20px 0 6px;border-top:1px solid var(--line);margin-top:22px}
section h2{margin:0 0 12px;color:var(--navy);font-size:22px}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s}
ol.steps li{position:relative;padding-left:40px;margin:0 0 14px}
ol.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center}
dl{margin:0}
dt{font-weight:600;color:var(--navy);margin-top:14px}
dd{margin:2px 0 0}
footer{border-top:1px solid var(--line);margin-top:34px;padding:18px 0 34px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
footer img{height:16px}
@media (max-width:560px){.hero{flex-direction:column;align-items:flex-start}.hero h1{font-size:28px}}

  ul.pick{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:24px 0}
  ul.pick a{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--navy);font-weight:600}
  ul.pick a:hover{border-color:var(--blue)}</style>
  <script>
  (function(){var c=["nl", "en", "de", "fr", "es", "it"];var l=(navigator.languages&&navigator.languages[0]||navigator.language||"en").slice(0,2).toLowerCase();
  location.replace((c.indexOf(l)>=0?l:"en")+"/");})();
  </script>
</head>
<body>
<main class="wrap">
  <div class="hero"><img src="pinline-icon.png" alt="" width="72" height="72"><div><h1>PinLine</h1><p>Keep your place while reading</p></div></div>
  <ul class="pick"><li><a href="nl/" lang="nl" hreflang="nl">Nederlands</a></li><li><a href="en/" lang="en" hreflang="en">English</a></li><li><a href="de/" lang="de" hreflang="de">Deutsch</a></li><li><a href="fr/" lang="fr" hreflang="fr">Français</a></li><li><a href="es/" lang="es" hreflang="es">Español</a></li><li><a href="it/" lang="it" hreflang="it">Italiano</a></li></ul>
</main>
<footer><div class="wrap"><span>PinLine by</span><a href="https://mariodigital.eu/"><img src="mariodigital.png" alt="MarioDigital"></a></div></footer>
</body>
</html>
