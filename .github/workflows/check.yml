# Controleert de live website na elke publicatie (en op verzoek via "Run workflow").
name: Website controleren

on:
  workflow_run:
    workflows: ["Website publiceren"]
    types: [completed]
  workflow_dispatch:

jobs:
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Even wachten tot de server bij is
        run: sleep 10
      - name: Live pagina's controleren
        run: bash .github/scripts/check-site.sh
